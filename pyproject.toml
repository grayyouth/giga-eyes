[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "giga-eyes"
version = "0.2.0"
description = "Visual observation and AI-powered UI analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Giga", email = "giga@gigachat.ai"}
]
keywords = [
    "screen-capture",
    "image-analysis",
    "ui-testing",
    "ocr",
    "yolo",
    "computer-vision",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mss>=9.0.1",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "pywin32>=306",
    "ultralytics>=8.2.0",
    "pygetwindow>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
]
yolo = [
    "uitag>=0.6.0",
]
vision = [
    "torch>=2.0",
    "transformers>=4.40",
    "num2words>=0.5.0",
]
all = [
    "giga-eyes[dev,yolo,vision]",
]

[project.scripts]
giga-eyes = "giga_eyes.cli:main"

[project.urls]
"Homepage" = "https://github.com/gigacode/giga-eyes"
"Bug Tracker" = "https://github.com/gigacode/giga-eyes/issues"
"Documentation" = "https://github.com/gigacode/giga-eyes#readme"
"Source Code" = "https://github.com/gigacode/giga-eyes"

[tool.setuptools.packages.find]
include = ["giga_eyes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
